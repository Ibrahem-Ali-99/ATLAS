services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      ATLAS_ENVIRONMENT: ${ATLAS_ENVIRONMENT:-development}
      ATLAS_SECRET_KEY: ${ATLAS_SECRET_KEY:?Set ATLAS_SECRET_KEY in .env}
      ATLAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@postgres:5432/${POSTGRES_DB:-atlas}
      ATLAS_CORS_ORIGINS: ${ATLAS_CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      ATLAS_COOKIE_SECURE: ${ATLAS_COOKIE_SECURE:-false}
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
      ATLAS_LLM_BASE_URL: ${ATLAS_LLM_BASE_URL:-https://api.openai.com/v1}
      ATLAS_LLM_API_KEY: ${ATLAS_LLM_API_KEY:-}
      ATLAS_LLM_MODEL: ${ATLAS_LLM_MODEL:-gpt-4o-mini}
      ATLAS_EMBEDDING_BASE_URL: ${ATLAS_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      ATLAS_EMBEDDING_API_KEY: ${ATLAS_EMBEDDING_API_KEY:-}
      ATLAS_EMBEDDING_MODEL: ${ATLAS_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      ATLAS_EMBEDDING_DIMENSIONS: ${ATLAS_EMBEDDING_DIMENSIONS:-768}
      ATLAS_MAX_COSINE_DISTANCE: ${ATLAS_MAX_COSINE_DISTANCE:-0.55}
      ATLAS_MAX_UPLOAD_BYTES: ${ATLAS_MAX_UPLOAD_BYTES:-10485760}
      ATLAS_STORAGE_DIR: /var/lib/atlas/storage
      ATLAS_MODEL_DIR: /var/lib/atlas/models
      ATLAS_LLM_PROVIDER: ${ATLAS_LLM_PROVIDER:-openai}
      ATLAS_EMBEDDING_PROVIDER: ${ATLAS_EMBEDDING_PROVIDER:-openai}
      ATLAS_LANGFUSE_PUBLIC_KEY: ${ATLAS_LANGFUSE_PUBLIC_KEY:-}
      ATLAS_LANGFUSE_SECRET_KEY: ${ATLAS_LANGFUSE_SECRET_KEY:-}
      ATLAS_LANGFUSE_HOST: ${ATLAS_LANGFUSE_HOST:-}
      ATLAS_PUBLIC_API_URL: ${ATLAS_PUBLIC_API_URL:-http://api:8000}
      ATLAS_N8N_LEAD_WEBHOOK_URL: ${ATLAS_N8N_LEAD_WEBHOOK_URL:-http://n8n:5678/webhook/atlas-lead}
      ATLAS_EMAIL_MODE: ${ATLAS_EMAIL_MODE:-sandbox}
      ATLAS_CAMPAIGN_PUBLIC_URL: ${ATLAS_CAMPAIGN_PUBLIC_URL:-http://127.0.0.1:${API_PORT:-8000}}
      ATLAS_CAMPAIGN_LINK_SECRET: ${ATLAS_CAMPAIGN_LINK_SECRET:-}
      ATLAS_INBOX_WEBHOOK_SECRET: ${ATLAS_INBOX_WEBHOOK_SECRET:-}
      ATLAS_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${ATLAS_WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      ATLAS_WHATSAPP_WEBHOOK_APP_SECRET: ${ATLAS_WHATSAPP_WEBHOOK_APP_SECRET:-}
      ATLAS_SMTP_HOST: mailpit
      ATLAS_SMTP_PORT: 1025
      ATLAS_SMTP_FROM: ${ATLAS_SMTP_FROM:-atlas@localhost}
      ATLAS_CALENDAR_MODE: simulation
      ATLAS_GOOGLE_CALENDAR_CLIENT_ID: ${ATLAS_GOOGLE_CALENDAR_CLIENT_ID:-}
      ATLAS_GOOGLE_CALENDAR_CLIENT_SECRET: ${ATLAS_GOOGLE_CALENDAR_CLIENT_SECRET:-}
      ATLAS_GOOGLE_CALENDAR_REDIRECT_URI: ${ATLAS_GOOGLE_CALENDAR_REDIRECT_URI:-}
      ATLAS_GOOGLE_CALENDAR_WEB_ORIGIN: ${ATLAS_GOOGLE_CALENDAR_WEB_ORIGIN:-}
    volumes:
      - atlas_uploads:/var/lib/atlas/storage
      - atlas_models:/var/lib/atlas/models
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    profiles: ["demo"]
    build:
      context: ../apps/web-rebuild
      dockerfile: Dockerfile
      args:
        ATLAS_API_URL: ${ATLAS_API_URL:-http://api:8000}
        ATLAS_PUBLIC_SITE: ${ATLAS_PUBLIC_SITE:-}
    environment:
      ATLAS_API_URL: ${ATLAS_API_URL:-http://api:8000}
      ATLAS_PUBLIC_SITE: ${ATLAS_PUBLIC_SITE:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - atlas_mailpit_data:/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.70.3
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-a-long-random-string}
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      # ATLAS_PUBLIC_API_URL stays the operational callback. 8012 is the
      # portfolio API. 8013 is the Harbor listener. All three stay allowed.
      ATLAS_PUBLIC_API_URL: ${ATLAS_PUBLIC_API_URL:-http://host.docker.internal:8000}
      ATLAS_LEAD_CALLBACK_ORIGINS: ${ATLAS_LEAD_CALLBACK_ORIGINS:-http://api:8000,http://host.docker.internal:8000,http://host.docker.internal:8012,http://host.docker.internal:8013}
      ATLAS_HOOK_SECRET: ${ATLAS_HOOK_SECRET:-}
      ATLAS_HOOK_KEY_ID: ${ATLAS_HOOK_KEY_ID:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - atlas_n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    restart: unless-stopped

volumes:
  atlas_postgres_data:
  atlas_uploads:
  atlas_models:
  atlas_mailpit_data:
  atlas_n8n_data:
