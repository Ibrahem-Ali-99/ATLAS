# Production stack. Development is infrastructure/compose.yaml.
# Staging is infrastructure/compose.staging.yaml.
# Only Caddy publishes ports. Postgres, n8n, Mailpit, and Ollama stay on `private`.
# Run from the repository root after preflight passes:
#   infrastructure/production/up.sh

name: atlas-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      ATLAS_SITE_HOST: ${PRODUCTION_HOST:?Set PRODUCTION_HOST}
    ports:
      - "${PRODUCTION_HTTP_PORT:?Set PRODUCTION_HTTP_PORT}:80"
      - "${PRODUCTION_HTTPS_PORT:?Set PRODUCTION_HTTPS_PORT}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - atlas_production_caddy_data:/data
      - atlas_production_caddy_config:/config
    networks:
      - private
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ../apps/web-rebuild
      dockerfile: Dockerfile
      args:
        ATLAS_API_URL: http://api:8000
        ATLAS_PUBLIC_SITE: "0"
    environment:
      ATLAS_API_URL: http://api:8000
      ATLAS_PUBLIC_SITE: "0"
    networks:
      - private
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      ATLAS_ENVIRONMENT: production
      ATLAS_PUBLIC_DEMO: "false"
      ATLAS_SECRET_KEY: ${PRODUCTION_SECRET_KEY:?Set PRODUCTION_SECRET_KEY}
      ATLAS_CREDENTIAL_ENCRYPTION_KEYS: ${PRODUCTION_CREDENTIAL_ENCRYPTION_KEYS:?Set PRODUCTION_CREDENTIAL_ENCRYPTION_KEYS}
      ATLAS_DATABASE_URL: postgresql+psycopg://${PRODUCTION_POSTGRES_USER:-atlas}:${PRODUCTION_POSTGRES_PASSWORD:?Set PRODUCTION_POSTGRES_PASSWORD}@postgres:5432/${PRODUCTION_POSTGRES_DB:-atlas}
      ATLAS_CORS_ORIGINS: ${PRODUCTION_CORS_ORIGINS:?Set PRODUCTION_CORS_ORIGINS}
      ATLAS_COOKIE_SECURE: "true"
      ATLAS_LOG_LEVEL: ${PRODUCTION_LOG_LEVEL:-INFO}
      ATLAS_LLM_PROVIDER: ${PRODUCTION_LLM_PROVIDER:?Set PRODUCTION_LLM_PROVIDER}
      ATLAS_LLM_BASE_URL: ${PRODUCTION_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      ATLAS_LLM_API_KEY: ${PRODUCTION_LLM_API_KEY:?Set PRODUCTION_LLM_API_KEY}
      ATLAS_LLM_MODEL: ${PRODUCTION_LLM_MODEL:?Set PRODUCTION_LLM_MODEL}
      ATLAS_EMBEDDING_PROVIDER: ${PRODUCTION_EMBEDDING_PROVIDER:-ollama}
      ATLAS_EMBEDDING_BASE_URL: ${PRODUCTION_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      ATLAS_EMBEDDING_API_KEY: ${PRODUCTION_EMBEDDING_API_KEY:-}
      ATLAS_EMBEDDING_MODEL: ${PRODUCTION_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      ATLAS_EMBEDDING_DIMENSIONS: ${PRODUCTION_EMBEDDING_DIMENSIONS:-768}
      ATLAS_STORAGE_DIR: /var/lib/atlas/storage
      ATLAS_MODEL_DIR: /var/lib/atlas/models
      ATLAS_PUBLIC_API_URL: http://api:8000
      ATLAS_N8N_LEAD_WEBHOOK_URL: http://n8n:5678/webhook/atlas-lead
      ATLAS_EMAIL_MODE: ${PRODUCTION_EMAIL_MODE:-sandbox}
      ATLAS_EMAIL_LIVE_ENABLED: ${PRODUCTION_EMAIL_LIVE_ENABLED:-false}
      ATLAS_CAMPAIGN_PUBLIC_URL: ${PRODUCTION_CAMPAIGN_PUBLIC_URL:?Set PRODUCTION_CAMPAIGN_PUBLIC_URL}
      ATLAS_CAMPAIGN_LINK_SECRET: ${PRODUCTION_CAMPAIGN_LINK_SECRET:-}
      ATLAS_CAMPAIGN_LIVE_ENABLED: "false"
      ATLAS_SMTP_HOST: ${PRODUCTION_SMTP_HOST:-mailpit}
      ATLAS_SMTP_PORT: ${PRODUCTION_SMTP_PORT:-1025}
      ATLAS_SMTP_FROM: ${PRODUCTION_SMTP_FROM:-atlas@localhost}
      ATLAS_CALENDAR_MODE: simulation
      ATLAS_GOOGLE_CALENDAR_CLIENT_ID: ${PRODUCTION_GOOGLE_CALENDAR_CLIENT_ID:-}
      ATLAS_GOOGLE_CALENDAR_CLIENT_SECRET: ${PRODUCTION_GOOGLE_CALENDAR_CLIENT_SECRET:-}
      ATLAS_GOOGLE_CALENDAR_REDIRECT_URI: ${PRODUCTION_GOOGLE_CALENDAR_REDIRECT_URI:-}
      ATLAS_GOOGLE_CALENDAR_WEB_ORIGIN: ${PRODUCTION_GOOGLE_CALENDAR_WEB_ORIGIN:-}
      ATLAS_BILLING_PROVIDER: ${PRODUCTION_BILLING_PROVIDER:-sandbox}
      ATLAS_STRIPE_SECRET_KEY: ${PRODUCTION_STRIPE_SECRET_KEY:-}
      ATLAS_STRIPE_WEBHOOK_SECRET: ${PRODUCTION_STRIPE_WEBHOOK_SECRET:-}
      ATLAS_STRIPE_PRICE_IDS: ${PRODUCTION_STRIPE_PRICE_IDS:-}
      ATLAS_BILLING_PUBLIC_URL: ${PRODUCTION_BILLING_PUBLIC_URL:-}
      ATLAS_INBOX_WEBHOOK_SECRET: ${PRODUCTION_INBOX_WEBHOOK_SECRET:-}
      ATLAS_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${PRODUCTION_WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      ATLAS_WHATSAPP_WEBHOOK_APP_SECRET: ${PRODUCTION_WHATSAPP_WEBHOOK_APP_SECRET:-}
      ATLAS_WHATSAPP_LIVE_ENABLED: ${PRODUCTION_WHATSAPP_LIVE_ENABLED:-false}
    volumes:
      - atlas_production_uploads:/var/lib/atlas/storage
      - atlas_production_models:/var/lib/atlas/models
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      ollama:
        condition: service_started
      embedding-model:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    logging: *default-logging
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${PRODUCTION_POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${PRODUCTION_POSTGRES_PASSWORD:?Set PRODUCTION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PRODUCTION_POSTGRES_DB:-atlas}
    volumes:
      - atlas_production_postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PRODUCTION_POSTGRES_USER:-atlas} -d ${PRODUCTION_POSTGRES_DB:-atlas}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - atlas_production_mailpit_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "/mailpit readyz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.49.6
    environment:
      N8N_HOST: n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/
      N8N_ENCRYPTION_KEY: ${PRODUCTION_N8N_ENCRYPTION_KEY:?Set PRODUCTION_N8N_ENCRYPTION_KEY before the first start}
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      ATLAS_PUBLIC_API_URL: http://api:8000
      ATLAS_HOOK_KEY_ID: ${PRODUCTION_HOOK_KEY_ID:-}
      ATLAS_HOOK_SECRET: ${PRODUCTION_HOOK_SECRET:-}
    volumes:
      - atlas_production_n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    networks:
      - private
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - atlas_production_ollama_data:/root/.ollama
    networks:
      - private
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1280M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  embedding-model:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "app.scripts.provision_embedding"]
    user: "10001"
    environment:
      ATLAS_EMBEDDING_PROVIDER: ${PRODUCTION_EMBEDDING_PROVIDER:-ollama}
      ATLAS_EMBEDDING_BASE_URL: ${PRODUCTION_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      ATLAS_EMBEDDING_MODEL: ${PRODUCTION_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      ATLAS_EMBEDDING_DIMENSIONS: ${PRODUCTION_EMBEDDING_DIMENSIONS:-768}
    networks:
      - private
    depends_on:
      ollama:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  private:

volumes:
  atlas_production_caddy_data:
  atlas_production_caddy_config:
  atlas_production_postgres_data:
  atlas_production_uploads:
  atlas_production_models:
  atlas_production_mailpit_data:
  atlas_production_n8n_data:
  atlas_production_ollama_data:
