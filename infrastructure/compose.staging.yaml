# Staging stack. The local development file is infrastructure/compose.yaml.
# Only Caddy publishes ports. Postgres, n8n, Mailpit, and Ollama stay on `private`.
# Run from the repository root:
#   docker compose --project-name atlas-staging --project-directory infrastructure -f infrastructure/compose.staging.yaml --env-file infrastructure/staging/.env up -d --build

name: atlas-staging

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      ATLAS_SITE_HOST: ${STAGING_HOST:-atlas.localhost}
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - atlas_staging_caddy_data:/data
      - atlas_staging_caddy_config:/config
    networks:
      - private
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: same-origin
    networks:
      - private
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      ATLAS_ENVIRONMENT: ${STAGING_ENVIRONMENT:?Set STAGING_ENVIRONMENT in infrastructure/staging/.env}
      ATLAS_PUBLIC_DEMO: "false"
      ATLAS_SECRET_KEY: ${STAGING_SECRET_KEY:?Set STAGING_SECRET_KEY in infrastructure/staging/.env}
      ATLAS_CREDENTIAL_ENCRYPTION_KEYS: ${STAGING_CREDENTIAL_ENCRYPTION_KEYS:-}
      ATLAS_DATABASE_URL: postgresql+psycopg://${STAGING_POSTGRES_USER:-atlas}:${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}@postgres:5432/${STAGING_POSTGRES_DB:-atlas}
      ATLAS_CORS_ORIGINS: ${STAGING_CORS_ORIGINS:-https://atlas.localhost}
      ATLAS_COOKIE_SECURE: "true"
      ATLAS_LOG_LEVEL: ${STAGING_LOG_LEVEL:-INFO}
      ATLAS_LLM_PROVIDER: ${STAGING_LLM_PROVIDER:-openai}
      ATLAS_LLM_BASE_URL: ${STAGING_LLM_BASE_URL:-https://api.openai.com/v1}
      ATLAS_LLM_API_KEY: ${STAGING_LLM_API_KEY:-}
      ATLAS_LLM_MODEL: ${STAGING_LLM_MODEL:-gpt-4o-mini}
      ATLAS_EMBEDDING_PROVIDER: ${STAGING_EMBEDDING_PROVIDER:-ollama}
      ATLAS_EMBEDDING_BASE_URL: ${STAGING_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      ATLAS_EMBEDDING_API_KEY: ${STAGING_EMBEDDING_API_KEY:-}
      ATLAS_EMBEDDING_MODEL: ${STAGING_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      ATLAS_EMBEDDING_DIMENSIONS: ${STAGING_EMBEDDING_DIMENSIONS:-768}
      ATLAS_STORAGE_DIR: /var/lib/atlas/storage
      ATLAS_MODEL_DIR: /var/lib/atlas/models
      ATLAS_PUBLIC_API_URL: http://api:8000
      ATLAS_N8N_LEAD_WEBHOOK_URL: http://n8n:5678/webhook/atlas-lead
      ATLAS_EMAIL_MODE: sandbox
      ATLAS_EMAIL_LIVE_ENABLED: "false"
      ATLAS_CAMPAIGN_PUBLIC_URL: ${STAGING_CAMPAIGN_PUBLIC_URL:-https://${STAGING_HOST:-atlas.localhost}:${STAGING_HTTPS_PORT:-443}}
      ATLAS_CAMPAIGN_LINK_SECRET: ${STAGING_CAMPAIGN_LINK_SECRET:-}
      ATLAS_SMTP_HOST: mailpit
      ATLAS_SMTP_PORT: "1025"
      ATLAS_SMTP_FROM: ${STAGING_SMTP_FROM:-atlas@localhost}
      ATLAS_CALENDAR_MODE: simulation
      ATLAS_GOOGLE_CALENDAR_CLIENT_ID: ${STAGING_GOOGLE_CALENDAR_CLIENT_ID:-}
      ATLAS_GOOGLE_CALENDAR_CLIENT_SECRET: ${STAGING_GOOGLE_CALENDAR_CLIENT_SECRET:-}
      ATLAS_GOOGLE_CALENDAR_REDIRECT_URI: ${STAGING_GOOGLE_CALENDAR_REDIRECT_URI:-}
      ATLAS_GOOGLE_CALENDAR_WEB_ORIGIN: ${STAGING_GOOGLE_CALENDAR_WEB_ORIGIN:-}
      ATLAS_BILLING_PROVIDER: ${STAGING_BILLING_PROVIDER:-sandbox}
      ATLAS_STRIPE_SECRET_KEY: ${STAGING_STRIPE_SECRET_KEY:-}
      ATLAS_STRIPE_WEBHOOK_SECRET: ${STAGING_STRIPE_WEBHOOK_SECRET:-}
      ATLAS_STRIPE_PRICE_IDS: ${STAGING_STRIPE_PRICE_IDS:-}
      ATLAS_BILLING_PUBLIC_URL: ${STAGING_BILLING_PUBLIC_URL:-}
      ATLAS_INBOX_WEBHOOK_SECRET: ${STAGING_INBOX_WEBHOOK_SECRET:-}
      ATLAS_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${STAGING_WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      ATLAS_WHATSAPP_WEBHOOK_APP_SECRET: ${STAGING_WHATSAPP_WEBHOOK_APP_SECRET:-}
    volumes:
      - atlas_staging_uploads:/var/lib/atlas/storage
      - atlas_staging_models:/var/lib/atlas/models
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      ollama:
        condition: service_started
      embedding-model:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-atlas}
    volumes:
      - atlas_staging_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER:-atlas} -d ${STAGING_POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - atlas_staging_mailpit_data:/data
    networks:
      - private
    restart: unless-stopped

  n8n:
    image: ${STAGING_N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.49.6}
    environment:
      N8N_HOST: n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/
      N8N_ENCRYPTION_KEY: ${STAGING_N8N_ENCRYPTION_KEY:?Set STAGING_N8N_ENCRYPTION_KEY before the first start}
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      ATLAS_PUBLIC_API_URL: http://api:8000
      ATLAS_HOOK_KEY_ID: ${STAGING_HOOK_KEY_ID:-}
      ATLAS_HOOK_SECRET: ${STAGING_HOOK_SECRET:-}
    volumes:
      - atlas_staging_n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    networks:
      - private
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - atlas_staging_ollama_data:/root/.ollama
    networks:
      - private
    restart: unless-stopped

  embedding-model:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "app.scripts.provision_embedding"]
    user: "10001"
    environment:
      ATLAS_EMBEDDING_PROVIDER: ${STAGING_EMBEDDING_PROVIDER:-ollama}
      ATLAS_EMBEDDING_BASE_URL: ${STAGING_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      ATLAS_EMBEDDING_MODEL: ${STAGING_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      ATLAS_EMBEDDING_DIMENSIONS: ${STAGING_EMBEDDING_DIMENSIONS:-768}
    networks:
      - private
    depends_on:
      ollama:
        condition: service_started
    restart: "no"

networks:
  private:

volumes:
  atlas_staging_caddy_data:
  atlas_staging_caddy_config:
  atlas_staging_postgres_data:
  atlas_staging_uploads:
  atlas_staging_models:
  atlas_staging_mailpit_data:
  atlas_staging_n8n_data:
  atlas_staging_ollama_data:
