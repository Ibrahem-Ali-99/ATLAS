name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-rebuild/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      # next build writes next-env.d.ts and .next/types, which tsc needs on a clean checkout.
      - run: npm run build
      - run: npm run typecheck

  legacy-web:
    # Keep coverage for the retired frontend without allowing it to block
    # canonical product releases.
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: change-me-admin
      SEED_ADMIN_NAME: Avery Admin
      SEED_STAFF_EMAIL: staff@example.com
      SEED_STAFF_PASSWORD: change-me-staff
      SEED_STAFF_NAME: Sam Staff
      SEED_OUTSIDER_EMAIL: outsider@example.org
      SEED_OUTSIDER_PASSWORD: change-me-outsider
      SEED_OUTSIDER_NAME: Olivia Outsider
      ATLAS_SECRET_KEY: test-secret-key-must-be-32-chars-min
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-rebuild/package-lock.json
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Install the web app and Playwright
        working-directory: apps/web-rebuild
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser test
        working-directory: apps/web-rebuild
        run: npx playwright test

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development, staging, and production Compose configuration
        run: |
          docker compose --env-file .env.example -f infrastructure/compose.yaml config --quiet
          docker compose --env-file infrastructure/staging/.env.example -f infrastructure/compose.staging.yaml config --quiet
          docker compose --env-file infrastructure/production/.env.example -f infrastructure/compose.production.yaml config --quiet
          docker compose --env-file infrastructure/portfolio/.env.example -f infrastructure/compose.portfolio.yaml config --quiet
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Verify staging, production, and portfolio configuration
        run: |
          uv run --project apps/api --frozen pytest -c apps/api/pyproject.toml -o addopts= -q infrastructure/staging/test_preflight.py
          uv run --project apps/api --frozen pytest -c apps/api/pyproject.toml -o addopts= -q infrastructure/production/test_preflight.py infrastructure/production/test_compose_contract.py infrastructure/production/test_migration_contract.py
          uv run --project apps/api --frozen pytest -c apps/api/pyproject.toml -o addopts= -q infrastructure/portfolio/test_portfolio_preflight.py infrastructure/portfolio/test_portfolio_compose.py infrastructure/portfolio/test_portfolio_project.py
      - name: Build the API image
        run: docker build -t atlas-api:ci apps/api
      - name: Build the web image
        run: docker build -t atlas-web:ci apps/web-rebuild

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Audit the JavaScript lockfile
        working-directory: apps/web-rebuild
        run: npm audit --audit-level=high
      - name: Export locked Python runtime dependencies
        if: always()
        id: python-lock
        working-directory: apps/api
        run: uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/api-requirements.txt"
      - name: Audit locked Python runtime dependencies
        if: always() && steps.python-lock.outcome == 'success'
        run: uvx --python 3.12 pip-audit@2.10.1 --disable-pip --require-hashes --strict -r "$RUNNER_TEMP/api-requirements.txt"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks detect --source . --redact --config .gitleaks.toml --verbose
