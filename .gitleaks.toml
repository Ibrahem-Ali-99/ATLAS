title = "ATLAS secret scan"

[extend]
useDefault = true

[allowlist]
description = "Generated dependencies, build output, and documented local placeholders"
paths = [
  '''apps/api/\.venv/''',
  '''apps/web/node_modules/''',
  '''apps/web/\.next/''',
  '''__pycache__/''',
  '''\.pytest_cache/''',
  '''\.ruff_cache/''',
  '''\.mypy_cache/''',
]
regexTarget = "match"
regexes = [
  '''replace-with-a-long-random-string''',
  '''change-me-(admin|staff|outsider)''',
  '''test-secret-key-must-be-32-chars-min''',
  '''sk_(test|live)_disposable''',
  '''rk_test_disposable''',
  '''legacy-test-secret-key-with-32-chars''',
  '''postgresql\+psycopg://atlas:atlas@''',
]
